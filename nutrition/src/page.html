<div id="lock" class="lock" hidden>
  <div class="box">
    <svg class="logo" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="var(--accent-soft)"/><path d="M28 14c-6 0-10 5-10 11 0 8 10 17 10 17s10-9 10-17c0-6-4-11-10-11z" fill="var(--accent)"/><circle cx="28" cy="25" r="4" fill="var(--surface)"/></svg>

    <p class="summary" id="summary-line">טוען את הנתונים…</p>

  <nav class="tabs" id="tabs" role="tablist" aria-label="ניווט">

    <button class="tab" role="tab" data-tab="settings">הגדרות</button>
  </nav>

  <main>
    <section data-panel="today" id="panel-today" class="active" role="tabpanel"></section>
    <section data-panel="log" id="panel-log" role="tabpanel"></section>
    <section data-panel="foods" id="panel-foods" role="tabpanel"></section>
    <section data-panel="supps" id="panel-supps" role="tabpanel"></section>
    <section data-panel="whatnext" id="panel-whatnext" role="tabpanel"></section>
    <section data-panel="chat" id="panel-chat" role="tabpanel"></section>
    <section data-panel="pregnancy" id="panel-pregnancy" role="tabpanel"></section>
    <section data-panel="history" id="panel-history" role="tabpanel"></section>
    <section data-panel="settings" id="panel-settings" role="tabpanel"></section>
  </main>

    כלי מעקב אישי בלבד — לא ייעוץ רפואי. היעדים מבוססים על ערכי DRI כלליים להריון (NIH/IOM, משרד הבריאות) וערכי מזון משוערים. יש לאמת החלטות תזונתיות ורפואיות מול הרופא/ה או הדיאטנית.
  </footer>
