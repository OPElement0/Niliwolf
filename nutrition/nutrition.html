<title>מעקב תזונה בהריון</title>
<meta name="robots" content="noindex, nofollow">

    --bad: #E8706A; --bad-soft: #3D2222;

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { direction: rtl; }

/* ---------- layout ---------- */
.app { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }

  font-size: 0.78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2);
}

  position: sticky; top: 0; z-index: 20; background: var(--bg);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {

  font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.tab .ico { width: 18px; height: 18px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 0.7rem; padding: 0 6px; min-width: 18px; text-align: center; }

@keyframes fade { from { opacity: 0.4; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-panel].active { animation: none; } * { transition: none !important; } }

.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card.soft { background: var(--surface-2); border-color: transparent; }
.card > h2, .card > h3 { margin-bottom: 8px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.divider { border: 0; border-top: 1px solid var(--line); margin-block: 10px; }
.disclaimer { color: var(--muted); font-size: 0.78rem; padding-block: 24px 8px; text-align: center; max-width: 60ch; margin-inline: auto; }

/* ---------- hero tiles ---------- */
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; }

.st-good { background: var(--good-soft); color: var(--good); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list > .item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }

.chip:hover, .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.static { cursor: default; }
.note { display: flex; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.9rem; align-items: flex-start; }
.note.alert { background: var(--bad-soft); color: var(--ink); border-inline-start: 3px solid var(--bad); }

.note.info { background: var(--accent-soft); border-inline-start: 3px solid var(--accent); }

/* ---------- supplements ---------- */
.supp { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }

.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; background: var(--surface); flex-shrink: 0; }

/* ---------- quick entry ---------- */
.quick { position: relative; }
.quick input { padding-inline-start: 44px; min-height: 48px; font-size: 1rem; }
.quick .plus { position: absolute; inset-inline-start: 6px; top: 4px; }
.suggest { position: absolute; inset-inline: 0; top: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow); z-index: 30; max-height: 280px; overflow-y: auto; }
.suggest button { display: flex; justify-content: space-between; width: 100%; border: 0; background: transparent; padding: 9px 12px; text-align: start; gap: 10px; }
.suggest button:hover, .suggest button.hl { background: var(--surface-2); }

.qty { width: 74px; min-height: 34px; padding: 4px 8px; text-align: center; }
.unit { width: auto; min-height: 34px; padding: 4px 8px; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.form-grid .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; }
.inline-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.inline-form .field { flex: 1 1 120px; }
.inline-form .field.short { flex: 0 1 90px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: start; }
.tbl th { color: var(--ink-2); font-weight: 600; font-size: 0.8rem; }
.tbl td.num, .tbl th.num { text-align: end; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.td-good { color: var(--good); font-weight: 600; } .td-warn { color: var(--warn); font-weight: 600; } .td-bad { color: var(--bad); font-weight: 600; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 12, 16, 0.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 640px) { .modal-bg { align-items: center; padding: 20px; } }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: var(--radius) var(--radius) 0 0; padding: 18px 18px 24px; box-shadow: var(--shadow); }
@media (min-width: 640px) { .modal { border-radius: var(--radius); } }
.modal h2 { margin-bottom: 12px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

/* ---------- chat ---------- */
.chat-box { display: flex; flex-direction: column; gap: 10px; min-height: 320px; }
.msgs { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 4px 2px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; line-height: 1.55; }
.msg.user { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-end-start-radius: 4px; }
.msg.ai { align-self: flex-end; background: var(--surface-2); border-end-end-radius: 4px; }
.msg.ai.thinking { color: var(--muted); font-style: italic; }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea { min-height: 48px; }
.ctx-toggle { font-size: 0.8rem; color: var(--ink-2); }

/* ---------- charts ---------- */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; max-width: 100%; height: auto; font-family: var(--font); }
.chart .axis { stroke: var(--line-strong); }

.chart text.strong { fill: var(--ink); font-weight: 600; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.avg { stroke: var(--accent-2); stroke-dasharray: 4 3; }

.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot.avg { fill: var(--accent-2); }
.chart .cell { rx: 3; stroke: var(--surface); stroke-width: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 4px; }
.tip { position: fixed; z-index: 60; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; pointer-events: none; max-width: 240px; box-shadow: var(--shadow); }

/* ---------- lock ---------- */
.lock { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lock .box { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
.lock input { text-align: center; font-size: 1.3rem; letter-spacing: 0.3em; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }
.toast { position: fixed; bottom: 84px; inset-inline: 0; margin-inline: auto; width: fit-content; max-width: 90%; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; z-index: 80; font-size: 0.9rem; box-shadow: var(--shadow); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.datenav { display: flex; align-items: center; gap: 6px; }
.datenav input[type="date"] { width: auto; min-height: 36px; padding: 4px 8px; }
.opt-card { border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; gap: 8px; }

.score { font-size: 1.4rem; font-weight: 700; }
.delta-up { color: var(--good); font-weight: 600; }
.delta-over { color: var(--bad); font-weight: 600; }
.mini-list { columns: 2; column-gap: 16px; font-size: 0.85rem; }
@media (max-width: 480px) { .mini-list { columns: 1; } }
.mini-list div { break-inside: avoid; display: flex; justify-content: space-between; padding: 2px 0; }
.help { font-size: 0.82rem; color: var(--muted); }

/* ---------- doses, donuts, check icons ---------- */
.doses { display: inline-flex; gap: 5px; flex-shrink: 0; }
.dose { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--surface); color: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.dose svg { width: 16px; height: 16px; }
.dose:hover { border-color: var(--accent-2); }
.dose.on { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.check-ico { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #fff; vertical-align: -3px; margin-inline-end: 5px; flex-shrink: 0; }
.check-ico svg { width: 11px; height: 11px; }
.donut { flex-shrink: 0; display: block; }
.donut text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.tile-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile .big { font-size: 1.55rem; }
.nut-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.nut-row:first-of-type { border-top: 0; }
.nut-row:hover { background: var(--surface-2); margin-inline: -8px; padding-inline: 8px; border-radius: var(--radius-sm); }
.chip.done { background: var(--good-soft); border-color: transparent; color: var(--ink); display: inline-flex; align-items: center; }
.tbl .donut { display: inline-block; vertical-align: middle; }

/* ---------- upper-limit gauge ---------- */
.ulg { display: flex; flex-direction: column; align-items: center; gap: 0; flex-shrink: 0; min-width: 100px; }
.ulg svg { display: block; }
.ulg-text { font-size: 0.7rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ulg.near .ulg-text, .ulg.over .ulg-text { color: var(--bad); font-weight: 700; }
.ulg.none { justify-content: center; }
.nut-row.row-near, .nut-row.row-over { background: var(--bad-soft); margin-inline: -8px; padding-inline: 8px; border-radius: var(--radius-sm); }
@media (max-width: 480px) { .ulg { min-width: 84px; } }
.ulg.soft .ulg-text { color: var(--warn); font-weight: 600; }

</style>

// Declarative rule engine — adjusts targets and produces notes from the pregnancy context.
// ctx = { week, trimester, weightKg, prepregWeightKg, heightCm, bmi, gainKg, gainRange,
//         labs: {marker: {value, date, week}}, diagnoses: Set, dietType, hour }
// Each rule: { id, when(ctx) -> bool, adjust(targets, ctx) -> void, note(ctx) -> string, level }
// level: "info" | "warn" | "alert"
window.RULES = [
  {
    id: "protein_by_weight",
    when: (c) => c.weightKg > 0,
    adjust: (t, c) => { t.protein = Math.max(t.protein, Math.round(c.weightKg * 1.1)); },
    note: () => "",
    level: "info",
  },
  {
    id: "iron_low",
    when: (c) => (c.labs.ferritin && c.labs.ferritin.value < 30) ||
                 (c.labs.hb && c.labs.hb.value < (c.trimester === 2 ? 10.5 : 11)) ||
                 c.diagnoses.has("anemia"),
    adjust: (t) => { t.iron = Math.max(t.iron, 30); },
    note: (c) => {
      const f = c.labs.ferritin ? `פריטין ${c.labs.ferritin.value}` : "";
      const h = c.labs.hb ? `המוגלובין ${c.labs.hb.value}` : "";
      const what = [f, h].filter(Boolean).join(", ") || "אנמיה";
      return `${what}: מאגרי ברזל נמוכים — מקור ברזל בכל ארוחה עם ויטמין C; להפריד ברזל מסידן, קפה ותה (שעתיים).`;
    },
    level: "alert",
  },
  {
    id: "vitd_low",
    when: (c) => c.labs.vitD && c.labs.vitD.value < 20,
    adjust: (t) => { t.vitD = Math.max(t.vitD, 25); },
    note: (c) => `ויטמין D ${c.labs.vitD.value} ng/mL — חסר. מקורות: תוסף, שמש${c.dietType === "vegan" ? ", מזון מועשר (משקאות צמחיים)" : ", סלמון, ביצים"}. לוודא עם הרופא/ה מינון תוסף.`,
    level: "warn",
  },
  {
    id: "vitd_borderline",
    when: (c) => c.labs.vitD && c.labs.vitD.value >= 20 && c.labs.vitD.value < 30,
    adjust: () => {},
    note: (c) => `ויטמין D ${c.labs.vitD.value} ng/mL — גבולי (רצוי 30+).`,
    level: "info",
  },
  {
    id: "b12_low",
    when: (c) => c.labs.b12 && c.labs.b12.value < 300,
    adjust: (t) => { t.b12 = Math.max(t.b12, 4); },
    note: (c) => `B12 ${c.labs.b12.value} pg/mL — ${c.labs.b12.value < 200 ? "חסר" : "גבולי"}. ${c.dietType === "vegan" ? "בתזונה טבעונית המקור היחיד הוא תוסף/מזון מועשר — לשקול העלאת מינון עם הרופא/ה." : "מקורות: ביצים, דגים, מוצרי חלב, בשר; לשקול תוסף."}`,
    level: (c) => (c.labs.b12.value < 200 ? "alert" : "warn"),
  },
  {
    id: "gdm",
    when: (c) => c.diagnoses.has("gdm") ||
                 (c.labs.glucose_fasting && c.labs.glucose_fasting.value > 92) ||
                 (c.labs.ogtt_50 && c.labs.ogtt_50.value > 140) ||
                 (c.labs.ogtt_100_2h && c.labs.ogtt_100_2h.value > 155),
    adjust: (t) => { t.carbs = Math.max(175, Math.min(t.carbs, 200)); t.carbsPerMeal = 45; t.carbsPerSnack = 20; },
    note: () => "רגישות לסוכר: לפזר פחמימות על פני היום (עד ~45 גרם בארוחה, ~20 בביניים), להעדיף פחמימות מלאות ולצרף חלבון לכל ארוחה.",
    level: "warn",
  },
  {
    id: "hypothyroid",
    when: (c) => c.diagnoses.has("hypothyroid") || (c.labs.tsh && c.labs.tsh.value > 3),
    adjust: () => {},
    note: () => "בלוטת התריס: לוודא יוד (220 מק\"ג) ולהפריד אלטרוקסין מברזל/סידן/סויה ב-4 שעות.",
    level: "info",
  },
  {
    id: "vegetarian",
    when: (c) => c.dietType === "vegetarian" || c.dietType === "vegan",
    adjust: (t) => { t.iron = Math.min(45, Math.round(t.iron * 1.8)); t.zinc = Math.round(t.zinc * 1.5); },
    note: (c) => c.dietType === "vegan"
      ? "טבעונות: יעד ברזל ואבץ מוגדל (ספיגה נמוכה מהצומח); B12, ויטמין D, DHA מאצות וסידן — בעיקר מתוספים/מזון מועשר."
      : "צמחונות: יעד ברזל ואבץ מוגדל (ספיגה נמוכה מהצומח); לשים לב ל-B12 ו-DHA.",
    level: "info",
  },
  {
    id: "twins",
    when: (c) => c.diagnoses.has("twins"),
    adjust: (t) => { t.kcal += 300; t.protein += 25; t.iron = Math.max(t.iron, 30); t.folate = Math.max(t.folate, 1000); },
    note: () => "תאומים: יעדי קלוריות, חלבון, ברזל וחומצה פולית מוגדלים.",
    level: "info",
  },
  {
    id: "gain_high",
    when: (c) => c.gainRange && c.gainKg != null && c.week >= 14 && c.gainKg > c.gainRange.expectedMax + 1,
    adjust: () => {},
    note: (c) => `עלייה במשקל (${c.gainKg.toFixed(1)} ק"ג) מעל הטווח המומלץ לשבוע ${c.week} (${c.gainRange.expectedMin.toFixed(1)}–${c.gainRange.expectedMax.toFixed(1)}). לא לצמצם קלוריות בלי רופא/ה — לשים לב למתוקים ומשקאות.`,
    level: "info",
  },
  {
    id: "gain_low",
    when: (c) => c.gainRange && c.gainKg != null && c.week >= 14 && c.gainKg < c.gainRange.expectedMin - 1,
    adjust: (t) => { t.kcal += 150; },
    note: (c) => `עלייה במשקל (${c.gainKg.toFixed(1)} ק"ג) מתחת לטווח לשבוע ${c.week} (${c.gainRange.expectedMin.toFixed(1)}–${c.gainRange.expectedMax.toFixed(1)}). להוסיף ארוחות ביניים עשירות (אגוזים, אבוקדו, טחינה).`,
    level: "warn",
  },
  {
    id: "nausea",
    when: (c) => c.diagnoses.has("nausea"),
    adjust: () => {},
    note: () => "בחילות: ארוחות קטנות ותכופות, פחמימה יבשה בבוקר, ג'ינג'ר, להפריד שתייה מאוכל.",
    level: "info",
  },
  {
    id: "constipation",
    when: (c) => c.diagnoses.has("constipation"),
    adjust: (t) => { t.fiber = Math.max(t.fiber, 30); t.water = Math.max(t.water, 2500); },
    note: () => "עצירות: יעד סיבים ונוזלים מוגדל; קטניות, פירות עם קליפה, שיבולת שועל, שזיפים.",
    level: "info",
  },
  {
    id: "hypertension",
    when: (c) => c.diagnoses.has("hypertension"),
    adjust: (t) => { t.sodium = 2000; t.calcium = Math.max(t.calcium, 1200); },
    note: () => "לחץ דם: להגביל נתרן (~2,000 מ\"ג), להקפיד על סידן, אשלגן ומגנזיום.",
    level: "info",
  },
  {
    id: "third_trimester",
    when: (c) => c.trimester === 3,
    adjust: () => {},
    note: () => "טרימסטר 3: הצורך בברזל, סידן ו-DHA בשיא — התינוק בונה מאגרים.",
    level: "info",
  },
];

<script>
// Hand-rolled SVG charts (no external libraries). Every function returns an SVG string.
// Colors come from CSS custom properties so both themes render correctly.
window.Charts = (function () {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  const fmt = (v, d = 0) => (v == null || isNaN(v) ? "–" : Number(v).toLocaleString("he-IL", { maximumFractionDigits: d }));

  function seqColor(p) {
    if (p == null) return "var(--surface-2)";
    if (p < 0.25) return "var(--seq-1)";
    if (p < 0.5) return "var(--seq-2)";
    if (p < 0.75) return "var(--seq-3)";
    if (p < 1) return "var(--seq-4)";
    return "var(--seq-5)";
  }

  // Heatmap: rows = nutrients, cols = days. cells[r][c] = {p: 0..1+ or null, tip}
  function heatmap({ rows, cols, cells }) {
    const cw = 22, ch = 22, left = 132, top = 42, gap = 2;
    const w = left + cols.length * (cw + gap) + 8;
    const h = top + rows.length * (ch + gap) + 8;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" direction="ltr" style="direction:ltr" role="img" aria-label="מפת חום של השגת יעדים">`;
    cols.forEach((c, i) => {
      const x = w - 8 - (i + 1) * (cw + gap) + gap + cw / 2;
      if (c.label) s += `<text x="${x}" y="${top - 8}" text-anchor="middle" transform="rotate(-45 ${x} ${top - 8})">${esc(c.label)}</text>`;
    });
    rows.forEach((r, ri) => {
      const y = top + ri * (ch + gap);
      s += `<text x="${w - 8 - cols.length * (cw + gap) - 6}" y="${y + ch / 2 + 4}" text-anchor="end" class="strong">${esc(r)}</text>`;
      cols.forEach((c, ci) => {
        const x = w - 8 - (ci + 1) * (cw + gap) + gap;
        const cell = cells[ri][ci];
        const p = cell ? cell.p : null;
        s += `<rect class="cell" x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${seqColor(p)}" data-tip="${esc(cell ? cell.tip : "אין נתונים")}"></rect>`;
      });
    });
    s += "</svg>";
    return s;
  }

  // Line chart with optional rolling-average series, target line, and band.
  function line({ points, avg, target, yMax, yMin, xLabels, yLabel, unit, band, height = 220 }) {
    const w = 640, h = height, left = 44, right = 12, top = 14, bottom = 34;
    const n = points.length;
    const iw = w - left - right, ih = h - top - bottom;
    const vals = points.map((p) => p.y).filter((v) => v != null).concat(avg ? avg.filter((v) => v != null) : [], target != null ? [target] : [], band ? band.flatMap((b) => [b.lo, b.hi]) : []);
    const maxV = yMax || Math.max(1, ...vals) * 1.12;
    const minV = yMin != null ? yMin : 0;
    const X = (i) => left + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
    // RTL: earliest on the right
    const Xr = (i) => left + iw - (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
    const Y = (v) => top + ih - ((v - minV) / (maxV - minV)) * ih;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" direction="ltr" style="direction:ltr" role="img" aria-label="${esc(yLabel || "")}">`;
    // grid
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const v = minV + ((maxV - minV) * t) / ticks;
      const y = Y(v);
      s += `<line class="grid" x1="${left}" x2="${w - right}" y1="${y}" y2="${y}"></line>`;
      s += `<text x="${left - 6}" y="${y + 4}" text-anchor="end">${fmt(v, v < 10 ? 1 : 0)}</text>`;
    }
    if (band && band.length) {
      const pts = band.map((b, i) => `${Xr(i)},${Y(b.hi)}`).concat(band.map((b, i) => `${Xr(i)},${Y(b.lo)}`).reverse());
      s += `<polygon class="band" points="${pts.join(" ")}"></polygon>`;
    }
    if (target != null) {
      s += `<line class="target" x1="${left}" x2="${w - right}" y1="${Y(target)}" y2="${Y(target)}"></line>`;
      s += `<text x="${w - right}" y="${Y(target) - 4}" text-anchor="end">יעד ${fmt(target)}</text>`;
    }
    // area + line
    const valid = points.map((p, i) => (p.y == null ? null : `${Xr(i)},${Y(p.y)}`));
    const segs = [];
    let cur = [];
    valid.forEach((v) => { if (v) cur.push(v); else { if (cur.length) segs.push(cur); cur = []; } });
    if (cur.length) segs.push(cur);
    segs.forEach((seg) => { s += `<polyline class="line" points="${seg.join(" ")}"></polyline>`; });
    if (avg) {
      const a = avg.map((v, i) => (v == null ? null : `${Xr(i)},${Y(v)}`)).filter(Boolean);
      if (a.length > 1) s += `<polyline class="line avg" points="${a.join(" ")}"></polyline>`;
    }
    points.forEach((p, i) => {
      if (p.y == null) return;
      s += `<circle class="dot" cx="${Xr(i)}" cy="${Y(p.y)}" r="${n > 40 ? 2.5 : 4}" data-tip="${esc((p.label || "") + ": " + fmt(p.y, 1) + (unit ? " " + unit : ""))}"></circle>`;
    });
    // x labels (sparse)
    const step = Math.max(1, Math.ceil(n / 8));
    points.forEach((p, i) => {
      if (i % step === 0 || (i === n - 1 && (n - 1) % step >= step / 2)) s += `<text x="${Xr(i)}" y="${h - 12}" text-anchor="middle">${esc(xLabels ? xLabels[i] : p.label || "")}</text>`;
    });
    s += `<line class="axis" x1="${left}" x2="${w - right}" y1="${top + ih}" y2="${top + ih}"></line>`;
    s += "</svg>";
    return s;
  }

  // Horizontal bars: items = [{label, p (0..1+), text, status}]
  function bars({ items, height }) {
    const rowH = 26, left = 110, right = 60, w = 560;
    const h = height || items.length * rowH + 10;
    const iw = w - left - right;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" direction="ltr" style="direction:ltr" role="img" aria-label="דירוג">`;
    items.forEach((it, i) => {
      const y = 5 + i * rowH;
      const p = Math.min(1.5, it.p || 0);
      const bw = Math.max(2, p * (iw / 1.5));
      const color = it.status === "good" ? "var(--good)" : it.status === "warn" ? "var(--warn)" : it.status === "bad" ? "var(--bad)" : "var(--accent)";
      s += `<text x="${w - 4}" y="${y + 17}" text-anchor="end" class="strong">${esc(it.label)}</text>`;
      s += `<rect x="${w - right - iw}" y="${y + 6}" width="${iw}" height="14" rx="4" fill="var(--surface-2)"></rect>`;
      s += `<rect x="${w - right - bw}" y="${y + 6}" width="${bw}" height="14" rx="4" fill="${color}" data-tip="${esc(it.tip || it.text)}"></rect>`;
      const tx = w - right - iw / 1.5;
      s += `<line x1="${tx}" x2="${tx}" y1="${y + 3}" y2="${y + 23}" stroke="var(--ink-2)" stroke-dasharray="2 2"></line>`;
      s += `<text x="${left - 6}" y="${y + 17}" text-anchor="end">${esc(it.text)}</text>`;
    });
    s += "</svg>";
    return s;
  }

  // Adherence calendar: days = [{date, label, p (0..1) or null, tip}] laid out by week (7 columns, RTL)
  function calendar({ days }) {
    const cw = 30, ch = 30, gap = 4, cols = 7;
    const rows = Math.ceil((days.length + (days[0] ? days[0].dow : 0)) / cols);
    const w = cols * (cw + gap) + 30, h = rows * (ch + gap) + 24;
    const names = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" direction="ltr" style="direction:ltr" role="img" aria-label="לוח היענות">`;
    names.forEach((nm, i) => { s += `<text x="${w - 30 - i * (cw + gap) - cw / 2}" y="12" text-anchor="middle">${nm}</text>`; });
    days.forEach((d, i) => {
      const c = d.dow, r = Math.floor((i + days[0].dow) / cols);
      const x = w - 30 - c * (cw + gap) - cw, y = 18 + r * (ch + gap);
      const fill = d.p == null ? "var(--surface-2)" : d.p >= 1 ? "var(--good)" : d.p > 0 ? "var(--warn)" : "var(--bad-soft)";
      s += `<rect class="cell" x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${fill}" data-tip="${esc(d.tip)}"></rect>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" text-anchor="middle" style="fill:${d.p != null && d.p >= 1 ? "#fff" : "var(--ink-2)"}">${d.label}</text>`;
    });
    s += "</svg>";
    return s;
  }

  return { heatmap, line, bars, calendar, seqColor };
})();

</script>
<script>
// Consultation chat + free-text meal parsing, via the artifact `sample` capability.
// Nothing is sent anywhere until the user presses Send / Parse.
window.NutriChat = (function () {
  let sampleFn = null, probed = false;
  async function getSample() {
    if (probed) return sampleFn;
    probed = true;
    try { sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; }
    return sampleFn;
  }

  const INSTRUCTIONS = `את/ה דיאטנ/ית קליני/ת שמלווה אישה בהריון במעקב תזונתי יומי. עני בעברית, בגובה העיניים, קצר וממוקד (עד ~8 שורות אלא אם התבקש פירוט).
כללים:
- התייחסי תמיד למצב של היום: מה כבר הושג, מה חסר, ומה כל אופציה שנשאלת עליה תוסיף (בערכים מספריים כשאפשר).
- העדיפי את סדר העדיפויות של המשתמשת: חלבון, פחמימות (פיזור לאורך היום), ברזל; ואז רכיבים שחסרים היום.
- תני תשובה ברורה (כן/לא/עדיף X) ולא רשימה של "תלוי".
- שימי לב לבטיחות מזון בהריון (בשר/דג לא מבושל, גבינות לא מפוסטרות, כספית בדגים, קפאין, אלכוהול) — הזכירי רק אם רלוונטי לשאלה.
- אם השאלה רפואית באמת (סימפטומים, תרופות, ערכי מעבדה מדאיגים) — הפני לרופא/ה, אבל עדיין תני את המידע התזונתי.
- אל תמציאי ערכים לבדיקות שלא סופקו.
להלן ההקשר המעודכן להיום:`;

  // Compact context (aim < 6K chars)
  function buildContext(app) {
    const d = app.state;
    const day = app.today();
    const t = app.targetsFor(app.dateKey());
    const tot = app.dayTotals(app.dateKey(), { includeSupplements: true });
    const totFood = app.dayTotals(app.dateKey(), { includeSupplements: false });
    const lines = [];
    const ctx = app.pregCtx();
    lines.push(`תאריך: ${app.dateKey()} (שעה ${new Date().getHours()}:00). שבוע הריון: ${ctx.week || "לא ידוע"} (טרימסטר ${ctx.trimester || "?"}).`);
    if (d.profile) {
      const p = d.profile;
      const parts = [];
      if (p.height_cm) parts.push(`גובה ${p.height_cm} ס"מ`);
      if (p.prepreg_weight_kg) parts.push(`משקל לפני ההריון ${p.prepreg_weight_kg} ק"ג`);
      if (ctx.weightKg) parts.push(`משקל נוכחי ${ctx.weightKg} ק"ג`);
      if (ctx.bmi) parts.push(`BMI לפני ההריון ${ctx.bmi.toFixed(1)}`);
      if (ctx.gainKg != null) parts.push(`עלייה עד כה ${ctx.gainKg.toFixed(1)} ק"ג`);
      if (p.diet_type && p.diet_type !== "omnivore") parts.push(`תזונה: ${p.diet_type}`);
      if (p.allergies) parts.push(`אלרגיות/הגבלות: ${p.allergies}`);
      if (parts.length) lines.push("פרופיל: " + parts.join(", ") + ".");
    }
    if (d.diagnoses && d.diagnoses.length) lines.push("אבחנות: " + d.diagnoses.map((x) => (window.DIAGNOSES.find((q) => q.key === x.code) || { he: x.code }).he + (x.note ? ` (${x.note})` : "")).join("; ") + ".");
    const labs = Object.values(ctx.labs || {});
    if (labs.length) lines.push("בדיקות אחרונות: " + labs.map((l) => `${l.he} ${l.value} ${l.unit} (${l.date})`).join("; ") + ".");
    const notes = app.rulesNotes();
    if (notes.length) lines.push("הערות ממנוע ההמלצות: " + notes.map((n) => n.text).join(" | "));
    lines.push("מצב היום (הושג / יעד, כולל תוספים; בסוגריים – ממזון בלבד):");
    window.NUTRIENTS.forEach((n) => {
      const v = tot[n.key] || 0, tv = t[n.key];
      if (!tv) return;
      lines.push(`- ${n.he}: ${app.fmt(v)} / ${app.fmt(tv)} ${n.unit} (${Math.round((v / tv) * 100)}%${totFood[n.key] !== v ? `, ממזון ${app.fmt(totFood[n.key] || 0)}` : ""})`);
    });
    const meals = (day.meals || []);
    if (meals.length) lines.push("מה נאכל היום: " + meals.map((m) => `${m.time || ""} ${m.name} ${m.qty} ${m.unit}`).join("; "));
    else lines.push("עדיין לא נרשם אוכל היום.");
    const supps = (d.supplements || []).filter((s) => s.active !== false);
    if (supps.length) lines.push("תוספים קבועים (נלקח/יחידות ליום): " + supps.map((s) => `${s.name} ${app.suppTaken(day, s)}/${app.suppDoses(s)}`).join(", ") + ".");
    const favs = (d.foods || []).filter((f) => f.favorite).slice(0, 25);
    if (favs.length) lines.push("מאכלים שהיא אוהבת ויש לה בבית: " + favs.map((f) => f.name).join(", ") + ".");
    return lines.join("\n").slice(0, 7000);
  }

  async function send(app, userText, ui) {
    const sample = await getSample();
    if (!sample) throw { code: "not_granted", message: "sample unavailable" };
    const hist = (app.state.chat && app.state.chat.turns) || [];
    const turns = hist.slice(-12).map((t) => ({ role: t.role === "ai" ? "assistant" : "user", content: t.content }));
    turns.push({ role: "user", content: userText });
    const input = [{ role: "user", content: INSTRUCTIONS + "\n\n" + buildContext(app) }, ...turns];
    const ctl = new AbortController();
    ui.onStart && ui.onStart(ctl);
    const res = await sample(input, {
      cache: false,
      signal: ctl.signal,
      onText: ({ text }) => ui.onText && ui.onText(text),
    });
    return res;
  }

  async function canSendImages() {
    const sample = await getSample();
    if (!sample || !sample.limits) return false;
    try { const caps = await sample.limits(); return !!(caps && caps.images); } catch (e) { return false; }
  }

  async function exportData() {
    const json = JSON.stringify(App.state, null, 1);
    const name = `nutrition-backup-${dateKeyOf(new Date())}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: name, data: json }); toast("הקובץ נשמר"); return; }
    } catch (e) { if (e && e.code === "declined") return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name; a.click(); } catch (e) {}
    openModal(`<h2>גיבוי</h2><p class="help">אם ההורדה לא נפתחה, העתיקי את הטקסט ושמרי אותו בקובץ.</p><textarea style="min-height:200px;font-size:.75rem;direction:ltr">${esc(json)}</textarea><div class="actions"><button class="btn" data-act="modal-close">סגירה</button></div>`);
  }
  async function importData(file) {
    try {
      const txt = await file.text(); const data = JSON.parse(txt);
      if (!data || typeof data !== "object" || !("days" in data)) throw new Error("bad");
      if (!confirm("לייבא את הקובץ? הנתונים הקיימים יוחלפו.")) return;
      App.state = Object.assign(emptyState(), data);
      await pushAll();
      toast("הייבוא הושלם"); render();
    } catch (e) { toast("הקובץ לא תקין"); }
  }
  async function pushAll() {
    writeCache();
    if (!App.db) return;
    await saveProfile(); await saveTargets(); await saveChat();
    for (const f of App.state.foods) await saveFood(f);
    for (const s of App.state.supplements) await saveSupp(s);
    for (const l of App.state.labs) await saveLab(l);
    for (const d of App.state.diagnoses) await saveDiag(d);
    for (const k of Object.keys(App.state.days)) await saveDay(k);
  }
  async function wipeAll() {
    if (!confirm("למחוק את כל הנתונים? הפעולה אינה הפיכה.")) return;
    if (!confirm("בטוחה? מומלץ לייצא גיבוי קודם.")) return;
    if (App.db) {
      const dels = [];
      App.state.foods.forEach((f) => dels.push(Store.del("foods", f.id)));
      App.state.supplements.forEach((s) => dels.push(Store.del("supplements", s.id)));
      App.state.labs.forEach((l) => dels.push(Store.del("labs", l.id)));
      App.state.diagnoses.forEach((d) => dels.push(Store.del("diagnoses", d.id)));
      Object.keys(App.state.days).forEach((k) => dels.push(Store.del("days", k)));
      dels.push(Store.del("settings", "profile"), Store.del("settings", "targets"), Store.del("chat", "history"));
      await Promise.all(dels);
    }
    App.state = emptyState(); try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    unlocked = true; render(); toast("הכול נמחק");
  }

  function quickSubmit() {
    const inp = $("quick-input"); if (!inp) return;
    const parsed = parseQuick(inp.value);
    if (!parsed.name && parsed.matches.length === 0) return;
    if (parsed.matches.length && (parsed.matches.length === 1 || normalizeHe(parsed.matches[0].name) === normalizeHe(parsed.name) || (parsed.matches[0].aliases || []).map(normalizeHe).includes(normalizeHe(parsed.name)))) {
      const f = parsed.matches[0];
      addMealEntry(App.date, f, parsed.qty, parsed.unit && unitOptions(f).includes(parsed.unit) ? parsed.unit : (parsed.unit ? (f.portions.find((p) => p.label.includes(parsed.unit)) || {}).label : null));
      inp.value = ""; toast(`נוסף: ${f.name}`); render();
      setTimeout(() => { const q = $("quick-input"); if (q) q.focus(); }, 30);
    } else if (parsed.matches.length) showSuggest(parsed.matches, parsed.name);
    else toast("לא נמצא מאכל בשם הזה — נסי חיפוש אחר או הוסיפי אותו ב'המאכלים שלי'");
  }

    const el = e.target.closest("[data-act]"); if (!el) return;
    const fn = actions[el.dataset.act];
    if (fn) { if (el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA") return; e.preventDefault(); try { const r = fn(el, e); if (r && r.catch) r.catch((err) => { console.error(err); toast("משהו השתבש: " + (err && err.message ? err.message : err)); }); } catch (err) { console.error(err); toast("משהו השתבש: " + (err && err.message ? err.message : err)); } }
  });
  document.addEventListener("keydown", (e) => {
    const el = e.target;
    if (el.id === "quick-input") { if (e.key === "Enter") { e.preventDefault(); quickSubmit(); } if (e.key === "Escape") { const s = $("quick-suggest"); if (s) s.hidden = true; } }
    if (el.id === "lock-pin" && e.key === "Enter") tryUnlock();
    if (el.id === "chat-text" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); actions["chat-send"](); }
    if (el.id === "pend-qty" && e.key === "Enter") actions["pend-add"]();
    if (el.id === "lab-value" && e.key === "Enter") actions["lab-add"]();
    if (el.id === "w-kg" && e.key === "Enter") actions["weight-save"]();
    if (el.id === "ai-text" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) runAiParse();
    if ((el.classList.contains("supp") || el.classList.contains("check")) && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target, act = el.dataset.act;
    if (act === "quick-typing") { const p = parseQuick(el.value); if (el.value.trim()) showSuggest(p.matches, p.name); else $("quick-suggest").hidden = true; }
    if (act === "foods-search") { foodsQuery = el.value; renderFoods(); const s = $("foods-search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    if (act === "ing-typing") { const list = searchFoods(el.value, 8); const box = $("ing-suggest"); if (!list.length || !el.value.trim()) { box.hidden = true; return; } box.innerHTML = list.map((f) => `<button data-act="ing-pick" data-food="${f.id}"><span>${esc(f.name)}</span><span class="cat">${f.generic ? esc(window.FOOD_CATEGORIES[f.cat] || "") : "שלי"}</span></button>`).join(""); box.hidden = false; }
    if (act === "opt-typing") { const i = el.dataset.i; const list = searchFoods(el.value, 8); const box = $("opt-suggest-" + i); if (!list.length || !el.value.trim()) { box.hidden = true; return; } box.innerHTML = list.map((f) => `<button data-act="opt-pick" data-food="${f.id}" data-i="${i}"><span>${esc(f.name)}</span><span class="cat">${f.generic ? esc(window.FOOD_CATEGORIES[f.cat] || "") : "שלי"}</span></button>`).join(""); box.hidden = false; }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, act = el.dataset.act;
    if (act === "date-set" && el.value) { App.date = el.value; pendingFood = null; render(); }
    if (act === "meal-qty") { const day = getDay(App.date); const m = day.meals.find((x) => x.id === el.dataset.id); const f = foodById(m.food_id); m.qty = Number(el.value) || 0; m.grams = Math.round(f ? gramsFor(f, m.qty, m.unit) : m.grams); m.nutrients = f ? nutrientsFor(f, m.grams) : m.nutrients; saveDay(App.date); render(); }
    if (act === "day-notes") { getDay(App.date).notes = el.value; saveDay(App.date); }
    if (act === "profile-field") { App.state.profile[el.dataset.k] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value; saveProfile(); render(); }
    if (act === "profile-check") { App.state.profile[el.dataset.k] = el.checked; saveProfile(); render(); }
    if (act === "override") { App.state.targets = App.state.targets || { overrides: {} }; App.state.targets.overrides = App.state.targets.overrides || {}; if (el.value === "") delete App.state.targets.overrides[el.dataset.k]; else App.state.targets.overrides[el.dataset.k] = Number(el.value); saveTargets(); renderHeader(); }
    if (act === "hist-key") { histKey = el.value; renderHistory(); }
    if (act === "hist-lab") { histLab = el.value; renderHistory(); }
    if (act === "import-file" && el.files[0]) importData(el.files[0]);
    if (el.id === "ai-photo") { const n = $("ai-photo-name"); if (n) n.textContent = el.files[0] ? el.files[0].name : ""; }
    if (act === "ing-grams") { const f = window._editFood; f.ingredients[Number(el.dataset.i)].grams = Number(el.value) || 0; f.name = $("ff-name").value; f.servings = Number($("ff-servings").value) || 1; recipeModal(f, false); }
    if (el.id && el.id.startsWith("opt") && (el.id.endsWith("-qty") || el.id.endsWith("-unit"))) { const i = Number(el.id.replace("opt", "").split("-")[0]); const o = options[i]; if (!o) return; o.qty = Number($("opt" + i + "-qty").value) || 0; o.unit = $("opt" + i + "-unit").value; renderWhatNext(); }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".quick")) document.querySelectorAll(".suggest").forEach((s) => { s.hidden = true; }); });
  // tabs
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (!b) return; App.tab = b.dataset.tab; pendingFood = null; render(); });
  $("lock-btn").addEventListener("click", tryUnlock);
  // tooltip
  const tip = $("tip");
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, e.clientX - tip.offsetWidth / 2));
    tip.style.left = x + "px"; tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
  });
  document.addEventListener("pointerdown", (e) => { if (!(e.target.closest && e.target.closest("[data-tip]"))) tip.hidden = true; });

  // ------------------------------------------------------------ boot
  (async function boot() {
    const cached = readCache();
    if (cached) App.state = Object.assign(emptyState(), cached);
    let sessionOk = false; try { sessionOk = sessionStorage.getItem("nutrition_unlocked") === "1"; } catch (e) {}
    if (hasPin() && !sessionOk) showLock(); else { unlocked = true; render(); }
    await Store.init();
    // after cloud snapshot, re-evaluate lock (pin may live only in cloud)
    setTimeout(() => { if (hasPin() && !sessionOk && !unlocked) showLock(); else if (!hasPin()) { unlocked = true; } render(); }, 800);
  })();
})();

</script>
